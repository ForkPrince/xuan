name: (Auto) Build ARM releases
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: Upstream tag to build (for example v0.3.0); empty builds every missing release
        required: false
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: auto-arm-releases
  cancel-in-progress: false
env:
  UPSTREAM_REPO: silverling/xuan
jobs:
  check-releases:
    name: Check upstream releases
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tags: ${{ steps.find-new.outputs.tags }}
    steps:
      - name: Find releases without ARM builds here
        id: find-new
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ -n ${REQUESTED_TAG:-} ]]; then
            tags=$(jq -cn --arg tag "$REQUESTED_TAG" '[$tag]')
          else
            upstream=$(gh api --paginate "repos/$UPSTREAM_REPO/releases?per_page=100" \
              | jq -sc 'add // [] | map(select(.draft | not) | .tag_name)')
            ours=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              | jq -sc 'add // [] | map(.tag_name)')
            tags=$(jq -cn --argjson upstream "$upstream" --argjson ours "$ours" \
              '($upstream - $ours)[:12]')
          fi
          echo "Releases to build: $tags"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
  build-linux-arm64:
    name: Linux aarch64 (${{ matrix.tag }})
    needs: check-releases
    if: needs.check-releases.outputs.tags != '[]'
    # Native aarch64 runner on glibc 2.35, matching upstream's x86_64 baseline.
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      XUAN_MAX_GLIBC: '2.35'
    strategy:
      fail-fast: false
      matrix:
        tag: ${{ fromJson(needs.check-releases.outputs.tags) }}
    steps:
      - name: Check out the upstream release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ matrix.tag }}
          persist-credentials: false
      - name: Check out this repository for patches
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: fork
          persist-credentials: false
      - name: Apply fork patches
        run: |
          set -euo pipefail
          shopt -s nullglob
          patches=(fork/.github/patches/*.patch)
          if (( ${#patches[@]} == 0 )); then
            echo "No patches to apply"
            exit 0
          fi
          for patch in "${patches[@]}"; do
            if git apply --check "$patch"; then
              git apply "$patch"
              echo "Applied $patch"
            else
              echo "::notice title=Patch skipped::$patch does not apply to ${{ matrix.tag }}"
            fi
          done
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libvulkan1 mesa-vulkan-drivers desktop-file-utils dpkg rpm cpio binutils squashfs-tools
      - name: Set up AppImage packaging
        run: |
          mkdir -p "$RUNNER_TEMP/appimage-tools"
          curl --fail --location --retry 3 \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-aarch64.AppImage \
            --output "$RUNNER_TEMP/appimage-tools/linuxdeploy"
          echo "620095110d693282b8ebeb244a95b5e911cf8f65f76c88b4b47d16ae6346fcff  $RUNNER_TEMP/appimage-tools/linuxdeploy" | sha256sum --check
          chmod +x "$RUNNER_TEMP/appimage-tools/linuxdeploy"
          curl --fail --location --retry 3 \
            https://github.com/NixOS/patchelf/releases/download/0.19.1/patchelf-0.19.1-aarch64.tar.gz \
            --output "$RUNNER_TEMP/patchelf.tar.gz"
          echo "a2f8f5add5910a521d35062adf2c9f55d75b65ae5508d290758787004054e702  $RUNNER_TEMP/patchelf.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/patchelf.tar.gz" -C "$RUNNER_TEMP/appimage-tools" ./bin/patchelf
          echo "$RUNNER_TEMP/appimage-tools" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/appimage-tools/bin" >> "$GITHUB_PATH"
      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Fetch dependencies
        run: cargo fetch --locked
      - name: Package
        run: scripts/package.sh all
      - name: Verify distribution packages
        run: python3 scripts/check-packages.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: xuan-${{ matrix.tag }}-linux-aarch64
          path: dist/*aarch64*
          if-no-files-found: error
  build-windows-arm64:
    name: Windows arm64 (${{ matrix.tag }})
    needs: check-releases
    if: needs.check-releases.outputs.tags != '[]'
    runs-on: windows-11-arm
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
    strategy:
      fail-fast: false
      matrix:
        tag: ${{ fromJson(needs.check-releases.outputs.tags) }}
    steps:
      - name: Check out the upstream release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ matrix.tag }}
          persist-credentials: false
      - name: Check out this repository for patches
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: fork
          persist-credentials: false
      - name: Check Windows packaging support
        id: support
        run: |
          set -euo pipefail
          if [[ -f scripts/package-windows.py ]]; then
            echo "supported=true" >> "$GITHUB_OUTPUT"
          else
            echo "supported=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Windows build skipped::${{ matrix.tag }} has no Windows packaging"
          fi
      - name: Apply fork patches
        if: steps.support.outputs.supported == 'true'
        run: |
          set -euo pipefail
          shopt -s nullglob
          patches=(fork/.github/patches/*.patch)
          if (( ${#patches[@]} == 0 )); then
            echo "No patches to apply"
            exit 0
          fi
          for patch in "${patches[@]}"; do
            if git apply --check "$patch"; then
              git apply "$patch"
              echo "Applied $patch"
            else
              echo "::notice title=Patch skipped::$patch does not apply to ${{ matrix.tag }}"
            fi
          done
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        if: steps.support.outputs.supported == 'true'
        with:
          python-version: '3.12'
      - name: Verify the ARM64 interpreter
        if: steps.support.outputs.supported == 'true'
        run: |
          python - <<'PY'
          import platform
          import sys

          machine = platform.machine().lower()
          assert machine in ("arm64", "aarch64"), (machine, sys.executable)
          PY
      - name: Set up Rust
        if: steps.support.outputs.supported == 'true'
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-pc-windows-msvc
      - name: Fetch dependencies
        if: steps.support.outputs.supported == 'true'
        run: cargo fetch --locked
      - name: Package
        if: steps.support.outputs.supported == 'true'
        run: python scripts/package-windows.py
      - name: Verify distribution packages
        if: steps.support.outputs.supported == 'true'
        run: python scripts/check-packages.py --windows
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: steps.support.outputs.supported == 'true'
        with:
          name: xuan-${{ matrix.tag }}-windows-arm64
          path: dist/xuan-*-windows-arm64.zip*
          if-no-files-found: error
  publish:
    name: Publish ${{ matrix.tag }}
    needs: [check-releases, build-linux-arm64, build-windows-arm64]
    # Publish whatever the build jobs produced, so one broken tag does not hold
    # back the releases that did build.
    if: |
      !cancelled() &&
      needs.check-releases.result == 'success' &&
      needs.check-releases.outputs.tags != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        tag: ${{ fromJson(needs.check-releases.outputs.tags) }}
    steps:
      - name: Download ARM artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: xuan-${{ matrix.tag }}-*
          merge-multiple: true
          path: dist
      - name: Verify checksums
        working-directory: dist
        run: |
          set -euo pipefail
          ls -la
          shopt -s nullglob
          checksums=(*.sha256)
          if (( ${#checksums[@]} == 0 )); then
            echo "::error::No ARM assets were built for ${{ matrix.tag }}"
            exit 1
          fi
          sha256sum --check "${checksums[@]}"
      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ matrix.tag }}
        run: |
          set -euo pipefail
          # Confirm the tag exists upstream; this also gates manual runs.
          upstream=$(gh api "repos/$UPSTREAM_REPO/releases/tags/$TAG")
          title=$(jq -r '.name // empty' <<<"$upstream")
          if [[ -z $title ]]; then
            title="xuan $TAG"
          fi
          prerelease=$(jq -r '.prerelease' <<<"$upstream")
          latest_tag=$(gh api "repos/$UPSTREAM_REPO/releases/latest" --jq '.tag_name' 2>/dev/null || true)
          assets=$(cd dist && printf -- '- `%s`\n' *)
          notes="Automated ARM64 build of [${UPSTREAM_REPO} ${TAG}](https://github.com/${UPSTREAM_REPO}/releases/tag/${TAG}).

          ## Assets
          ${assets}
          x86_64 builds and the source archive are published on the upstream release."
          # This repository is automation-only (patches + this workflow), so there
          # is no upstream commit to target; the tag is created on the default branch.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$title" --notes "$notes"
          fi
          latest=false
          prerelease_flag=false
          if [[ $prerelease == true ]]; then
            prerelease_flag=true
          elif [[ $latest_tag == "$TAG" ]]; then
            latest=true
          fi
          gh release edit "$TAG" \
            --title "$title" \
            --notes "$notes" \
            --latest="$latest" \
            --prerelease="$prerelease_flag"
          gh release upload "$TAG" dist/* --clobber
